{% extends 'store/main.html' %}

{% block title %}Log in — PharmAssist{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12">
    <div class="w-full max-w-md bg-white rounded-xl shadow-sm ring-1 ring-black/5 p-8">
        <h1 class="text-2xl font-semibold text-slate-900 mb-2">Log in</h1>
        <p class="text-sm text-slate-500 mb-6">
            Sign in with your company Tax ID to continue.
        </p>

        {% if error %}
        <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-4 py-2 text-sm text-red-700">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-slate-900 mb-2">
                    Tax ID (ИНН)
                </label>
                <input name="tax_id" type="text" required placeholder="e.g. 4000xxxxxxx"
                    class="w-full px-4 py-2.5 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#07beb8]" />
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-900 mb-2">
                    Password
                </label>
                <input name="password" type="password" required
                    class="w-full px-4 py-2.5 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#07beb8]" />
            </div>

            <button type="submit"
                class="w-full mt-2 bg-[#07beb8] text-white font-medium py-2.5 rounded-md hover:bg-[#05a4a0] transition">
                Log in
            </button>
        </form>

        <p class="text-sm text-slate-500 mt-6 text-center">
            Don't have an account yet?
            <a href="{% url 'register' %}" class="text-[#07beb8] font-medium hover:underline">
                Create one
            </a>
        </p>
    </div>
</div>
{% endblock %}
