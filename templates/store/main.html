<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PharmAssist{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{% static 'store/css/main.css' %}">
</head>

<body>

    <header class="bg-[#07beb8]">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between relative">
                <nav class="flex space-x-6">
                    <a href="{% url 'home' %}"
                        class="text-black text-lg px-3 py-2 rounded-lg transition-all duration-300 hover:bg-[#68d8d6] hover:scale-105 hover:shadow-lg">
                        Home
                    </a>
                    <a href="{% url 'store' %}"
                        class="text-black text-lg px-3 py-2 rounded-lg transition-all duration-300 hover:bg-[#68d8d6] hover:scale-105 hover:shadow-lg">
                        Store
                    </a>
                </nav>
                <div class="absolute left-1/2 transform -translate-x-1/2">
                    <img src="{% static 'store/img/logo.png' %}" alt="Logo"
                        class="h-16 w-16 rounded-full transition-all duration-500 hover:scale-125 hover:shadow-2xl cursor-pointer">
                </div>
                <div class="flex items-center space-x-4">
                    <a href="{% url 'cart' %}"
                        class="transition-all duration-300 hover:scale-105 hover:shadow-lg hover:bg-[#68d8d6] rounded-lg p-1">
                        <img src="{% static 'store/img/cart-black.png' %}" alt="Cart" class="h-10 w-10 cursor-pointer">
                    </a>

                    {% if request.user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="text-black text-lg px-4 py-2 rounded-lg bg-white/30 hover:bg-white/60 transition-all duration-300
                                  hover:shadow-lg">
                        {{ request.user.username }}
                    </a>
                    <a href="{% url 'logout' %}" class="text-black text-sm px-3 py-2 rounded-lg transition-all duration-300
                                  hover:bg-[#68d8d6]">
                        Logout
                    </a>
                    {% else %}
                    <a href="{% url 'login' %}" class="text-black text-lg px-4 py-2 rounded-lg transition-all duration-300
                                  hover:bg-[#68d8d6] hover:border-[#68d8d6] hover:border-2 hover:shadow-lg hover:scale-105
                                  border-2 border-transparent">
                        Log in
                    </a>
                    <a href="{% url 'register' %}" class="text-black text-lg px-4 py-2 rounded-lg bg-white/20 transition-all duration-300
                                  hover:bg-white/60 hover:shadow-lg">
                        Register
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </header>

    {% block content %}{% endblock content %}


    <script>

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        window.csrftoken = getCookie('csrftoken');
    </script>

    <script src="{% static 'store/js/cart.js' %}"></script>
</body>

</html>
